# Configuration of the web book. Built with `make docs` and published to
# GitHub Pages by the .github/workflows/sitio.yml workflow.
#
# The three URLs below are the only thing to touch if the repository changes
# its name or its account.

site_name: Curso de Prolog
site_description: >-
  Curso de SWI-Prolog en castellano, autoguiado, para estudiantes
  que nunca vieron Prolog. La mayoría de los ejemplos se abren y se corren en SWISH.
site_author: César Ballardini
# The user site CesarBallardini.github.io carries the custom domain
# katra.ballardini.com.ar, so this project site is served from that domain
# under the repository name. The trailing slash matters: the canonical links,
# the sitemap and 404.html are all built from this value.
site_url: https://katra.ballardini.com.ar/curso-de-prolog/
repo_url: https://github.com/CesarBallardini/curso-de-prolog
repo_name: CesarBallardini/curso-de-prolog
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# A warning is an error: a broken link or a chapter left out of the navigation
# has to turn the build red, not rot quietly inside the book.
strict: true

# A page that exists but is missing from the nav is unreachable for a reader,
# and MkDocs only mentions it at INFO level, where nobody sees it. Raised to a
# warning so that `strict: true` above turns it into a failed build: every
# chapter page and every solutions page has to be in the nav.
validation:
  nav:
    omitted_files: warn
  # Cross-references between chapters and sections are links with anchors.
  # A heading that gets renamed would leave them pointing nowhere, and MkDocs
  # only mentions a missing anchor at INFO level. Raised so the strict build
  # fails instead.
  links:
    anchors: warn

theme:
  name: material
  language: es
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro

plugins:
  - search:
      lang: es

# Puts the "Abrir en SWISH" link under every block that declares an example,
# with the whole source inside the link. See tools/swish_links.py. The second
# drops the links of docs/pdf.md to PDFs `make pdf` has not built.
hooks:
  - tools/tabla_pipes.py
  - tools/swish_links.py
  - tools/pdf_links.py
  - tools/slides_files.py
  - tools/assistant/index_hook.py

extra_css:
  - estilos/swish.css
  - estilos/assistant.css
  # KaTeX typesets the logic formulas. Vendored in docs/vendor/katex-0.16.11/
  # (the npm package's minified files and its woff2 fonts, MIT licence), so the
  # formulas do not depend on a CDN; tools/katex_pdf.py reads the same files.
  - vendor/katex-0.16.11/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - vendor/katex-0.16.11/katex.min.js
  - vendor/katex-0.16.11/contrib/auto-render.min.js
  # Mermaid draws the diagrams. Vendored in docs/vendor/mermaid-11.17.2/ (MIT licence): Material
  # fetches mermaid@11 from unpkg only when no `mermaid` global exists, so loading this copy first
  # keeps the diagrams off the CDN. Deferred: it runs before Material draws, without blocking the page.
  # It is on every page because instant navigation does not run the scripts of the next page.
  - path: vendor/mermaid-11.17.2/mermaid.min.js
    defer: true
  # The site search lists its results in the order of the course, not by relevance.
  - javascripts/search-order.js
  # The course assistant (docs/asistente.md): the panel and, imported by it, the Web Worker, the
  # retrieval module and the index that tools/assistant/index_hook.py writes when the site is built.
  - path: javascripts/assistant/panel.js
    type: module

markdown_extensions:
  - abbr
  - admonition
  # Math written as $inline$ and $$display$$ in the Markdown. `generic: true`
  # emits \(...\) and \[...\], which KaTeX renders and which GitHub also
  # understands when the source is read in the repository.
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  # An ordered list keeps its first number: the exercises of a chapter are numbered
  # across its pages, so the list on its second page may start at 9. It also keeps a
  # wrapped line that starts with «1987.» inside its bullet instead of opening a list.
  - sane_lists
  # Typographic dashes, quotes and ellipses: the same conversion markdown-it
  # does when it builds the PDF, so the site and the PDF agree.
  - smarty
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid diagrams are drawn in the browser from the same ```mermaid block
  # that GitHub already renders when the Markdown is read in the repository.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Rendered at the foot of every page, chapters included, so the licence notice
# does not have to be repeated in each file.
copyright: >-
  Copyright &copy; 2026 César Ballardini &mdash;
  <a href="https://github.com/CesarBallardini/curso-de-prolog/blob/main/LICENSE">licencia MIT</a>.
  Las fuentes que se citan mantienen la suya.

