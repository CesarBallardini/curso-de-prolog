# Builds the book and publishes it to GitHub Pages. Because the user site
# CesarBallardini.github.io carries the custom domain katra.ballardini.com.ar,
# this project site is served at https://katra.ballardini.com.ar/curso-de-prolog/
# -- the same way ley5110 and programacion-drracket already are. No DNS record
# and no CNAME file are involved; the domain comes from the user site.
#
# Requires Settings > Pages > Source = "GitHub Actions".
name: Publish the book

on:
  push:
    branches: [main]
  # On a pull request everything runs except the publishing step: the examples,
  # the SWISH sandbox and the part I rule have to be green before a chapter
  # gets in.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, and not `ubuntu-latest`: the swipl that runs the book's
    # transcripts comes from this image's own archive, so which image it is
    # forms part of what the build checks. See the SWI-Prolog step below.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to a full version on purpose: setup-uv stopped publishing
        # floating major tags after v7, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --frozen everywhere: the build uses exactly uv.lock, and a lockfile out
      # of sync with pyproject.toml fails here instead of resolving silently.
      - name: Install dependencies
        run: uv sync --frozen

      # The examples are loaded and tested with the same swipl the author uses,
      # 9.2.9, which is what Ubuntu 26.04 carries in universe.
      #
      # The version is not an implementation detail here. SWI-Prolog 10 changed
      # clause indexing, and with it which queries leave a choice point, which
      # is exactly what the transcripts of part I show: `abuelo(juan, luis)`
      # answers `true ; false.` under 9 and `true.` under 10, and
      # `gusta(Quien, prolog)` does the reverse. The book states in its writing
      # criteria that it shows the answers of SWI-Prolog 9, so this is the
      # version that has to run here.
      #
      # It no longer comes from ppa:swi-prolog/stable: that PPA publishes only
      # 10 now, and removed its last 9.2.9 build for noble in February 2026.
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox
          swipl --version

      # A jump to SWI-Prolog 10 would not break any of the steps below: it would
      # quietly turn six of the book's transcripts into failures, reported as if
      # the text were the thing that was wrong. Fail here instead, where the
      # cause is written down.
      - name: Check that it is SWI-Prolog 9
        run: |
          swipl -q -t halt -g 'current_prolog_flag(version, V), ( V >= 90000, V < 100000 -> true ; format(user_error, "this book shows the answers of SWI-Prolog 9; this is ~w~n", [V]), halt(1) )'

      - name: Chromium for the PDFs
        run: uv run --frozen playwright install --with-deps chromium

      # Before `make check`, because each chapter's PDF is copied into the site
      # and building the site is the last thing check does.
      - name: Build the chapter PDFs
        run: make pdf

      # The book's rules (part I), the plunit tests of every example, the SWISH
      # sandbox, the text kept in sync with the examples, and the site built
      # with --strict.
      - name: Check and build
        run: make check

      - name: Lint the tooling
        run: make lint

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
