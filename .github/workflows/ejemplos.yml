# The course's main promise: every example runs, and prints what the text says
# it prints. The plunit tests of every example, every transcript of the book
# against SWI-Prolog 9, the SWISH sandbox (the «▶ Abrir en SWISH» links), the
# Python side of chapters 29 to 31 and 36, and the lint of the tooling, with the
# types of the course assistant's tools and the vendored libraries of the site.
#
# Checking the whole book takes about twelve minutes, and most changes touch one
# or two chapters. So a run checks only the chapters a change can affect, one
# job per part of the book, in parallel: tools/ci-parts.py maps the changed
# files to chapters, adds every chapter whose examples or pages load the files
# of a changed one (read from the sources on each run, so there is no table to
# keep up to date), and selects everything when the tooling or the setup
# changes. Once a week, and on demand, the whole book is checked anyway.
name: Ejemplos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monday, 06:00 UTC: the whole book, so that a dependency the detection
  # misses, or a change in the runner's image, shows up within a week.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Which chapters to check, grouped by part. Only git and uv: no SWI-Prolog.
  partes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.partes.outputs.matrix }}
      python: ${{ steps.partes.outputs.python }}
      any: ${{ steps.partes.outputs.any }}
    steps:
      # The whole history, so that the base of the comparison is there.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a full version, like in .github/actions/preparar: setup-uv
      # stopped publishing floating major tags after v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      # A pull request is compared with its base, a push with the commit it
      # replaced. A push that creates a branch has no such commit (all zeros),
      # and a force push may leave one that is no longer in the history: the
      # script checks everything then, as it does on a schedule or by hand.
      - name: Chapters a change can affect
        id: partes
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          case "$EVENTO" in
            pull_request) uv run tools/ci-parts.py "$BASE_PR" ;;
            push)         uv run tools/ci-parts.py "$BASE_PUSH" ;;
            *)            uv run tools/ci-parts.py --all ;;
          esac

  # One job per part with a selected chapter, each checking only those chapters.
  ejemplos:
    needs: partes
    if: needs.partes.outputs.any == 'true'
    name: Parte ${{ matrix.parte }}
    strategy:
      # A failure in one part says nothing about the others: let them finish.
      fail-fast: false
      matrix: ${{ fromJSON(needs.partes.outputs.matrix) }}
    # Pinned, and not `ubuntu-latest`: the swipl that runs the book's
    # transcripts comes from this image's own archive, so which image it is
    # forms part of what the build checks.
    runs-on: ubuntu-26.04
    env:
      CAPITULOS: ${{ matrix.capitulos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No Chromium: only the pytest suite of chapter 36 opens a browser, and
      # that runs in the python job below.
      - name: Prepare
        uses: ./.github/actions/preparar

      - name: Tests of the examples
        run: make test e="$CAPITULOS"

      # The slide decks of these chapters too: check-transcripts reads
      # diapositivas/capitulo-NN.md beside the chapter's pages.
      - name: Transcripts against SWI-Prolog 9
        run: make transcripts e="$CAPITULOS"

      - name: SWISH sandbox
        run: make swish e="$CAPITULOS"

  # The Python side of chapters 29 to 31 and 36, when one of them is selected.
  python:
    needs: partes
    if: needs.partes.outputs.python == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Chromium too: the web pages of chapter 36 are tested in a browser.
      - name: Prepare
        uses: ./.github/actions/preparar
        with:
          chromium: 'true'

      # Prolog from Python through Janus, the Python clients of the services,
      # and the web pages. janus-swi 1.5.3 passes its foreign functions with a
      # pointer type that the 9.2.9 headers do not declare; GCC 15 makes that an
      # error, older compilers a warning, and it works at run time. The flag
      # turns that one error back into a warning.
      - name: Python examples (chapters 29 to 31 and 36)
        env:
          CFLAGS: -Wno-error=incompatible-pointer-types
        run: make appendix

  # On every run: it takes seconds, and needs uv and the lockfile only.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Lint the tooling
        run: make lint

      # pyright and pyrefly over tools/assistant/ (pyrightconfig.json, pyrefly.toml).
      - name: Type-check the course assistant's tools
        run: make types

      # docs/vendor/ against tools/vendor.lock.json and mkdocs.yml; no network.
      - name: Check the vendored libraries
        run: make vendor-check

  # One check with a name that does not depend on which parts ran, for branch
  # protection to require. A job that was skipped because nothing asked for it
  # is fine; one that failed or was cancelled is not.
  resultado:
    needs: [partes, ejemplos, python, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job that ran passed
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "partes, ejemplos, python, lint: $RESULTADOS"
          case " $RESULTADOS " in
            *' failure '*|*' cancelled '*) exit 1 ;;
          esac
