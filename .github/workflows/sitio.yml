# Builds the chapter PDFs and the site, and publishes them to GitHub Pages.
# Because the user site CesarBallardini.github.io carries the custom domain
# katra.ballardini.com.ar, this project site is served at
# https://katra.ballardini.com.ar/curso-de-prolog/ -- the same way ley5110 and
# programacion-drracket already are. No DNS record and no CNAME file are
# involved; the domain comes from the user site.
#
# The site carries the PDF of every chapter and solutions page (make pdf) and the
# slide decks of diapositivas/ (tools/slides_files.py), both linked from
# Apéndice B. The checks of the examples, the text and the decks run in their own
# workflows (ejemplos.yml, texto.yml, diapositivas.yml); a pull request has to
# pass them before it reaches main, where this one publishes.
#
# A pull request builds only the PDFs of the chapters it can affect, chosen by
# tools/ci-parts.py the same way the Ejemplos workflow chooses what to test;
# tools/pdf_links.py turns the links to the PDFs not built into plain text, so
# the strict build still passes. On main every PDF is built, as is published.
#
# Requires Settings > Pages > Source = "GitHub Actions".
name: PDF y sitio

on:
  push:
    branches: [main]
  # On a pull request the PDFs and the site are built, and nothing is published.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Which chapters a pull request can affect; anything else builds them all.
  # It runs on every event, and not only on pull requests: a skipped job skips
  # every job that needs it, directly or not, and the deploy job is one of them.
  partes:
    runs-on: ubuntu-latest
    outputs:
      capitulos: ${{ steps.partes.outputs.capitulos }}
    steps:
      # The whole history, so that the base of the pull request is there.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a full version, like in .github/actions/preparar: setup-uv
      # stopped publishing floating major tags after v7.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Chapters a change can affect
        id: partes
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" = pull_request ]; then
            uv run tools/ci-parts.py "$BASE_PR"
          else
            uv run tools/ci-parts.py --all
          fi

  build:
    needs: partes
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/preparar
        with:
          chromium: 'true'

      # Before the site, because each chapter's PDF is copied into it. An empty
      # e= would mean every PDF, hence the separate case of a pull request that
      # touches no chapter.
      - name: Build the chapter PDFs
        env:
          EVENTO: ${{ github.event_name }}
          CAPITULOS: ${{ needs.partes.outputs.capitulos }}
        run: |
          if [ "$EVENTO" != pull_request ]; then
            make pdf
          elif [ -n "$CAPITULOS" ]; then
            make pdf e="$CAPITULOS"
          else
            echo "This pull request touches no chapter: the site is built without PDFs."
          fi

      - name: Build the site
        run: make docs

      # The course assistant in a real browser (Chromium): its panel, its links, what it sends. It
      # reads the site just built; the index comes from tools/assistant/index_hook.py, run by the build.
      - name: Test the assistant
        run: uv run --frozen --group assistant pytest tools/assistant/tests

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
