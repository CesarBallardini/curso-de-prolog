# The course assistant's tests. A config of their own, so their markers and options do not reach the
# pytest suites of the chapters (make appendix).
[pytest]
addopts = -ra --strict-markers
# Each test gets the markers of its directory (conftest.py). Every test that needs a browser is an e2e
# Playwright test; the Gherkin specifications are, too.
markers =
    unit: no browser and no built site
    integration: read the built site (make docs) or the repository, no browser
    e2e: need a browser (Playwright): the retrieval module and the widget
    bdd: the Gherkin specifications of the widget (pytest-bdd)
