<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <title>Comparación: con X = 2 + 1 la variable queda ligada al término 2+1, un árbol con + en la raíz; con X is 2 + 1 queda ligada al número 3</title>
  <rect x="0" y="0" width="400" height="350" fill="#FFFFFF"/>
  <g font-family="Verdana, DejaVu Sans, sans-serif" font-weight="bold" font-size="20">
    <text x="20" y="32" fill="#1F3A5F">unificación</text>
    <text x="20" y="232" fill="#2E7D32">evaluación</text>
  </g>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="26" fill="#1F2933">
    <text x="200" y="32">X = 2 + 1</text>
    <text x="200" y="232">X is 2 + 1</text>
  </g>
  <line x1="20" y1="196" x2="380" y2="196" stroke="#C9D3DE" stroke-width="2"/>
  <!-- X = 2 + 1 -->
  <rect x="40" y="76" width="60" height="48" rx="8" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="104" y1="100" x2="190" y2="100" stroke="#1F3A5F" stroke-width="3"/>
  <polygon points="186,92 202,100 186,108" fill="#1F3A5F"/>
  <line x1="230" y1="100" x2="190" y2="162" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="230" y1="100" x2="270" y2="162" stroke="#1F3A5F" stroke-width="2"/>
  <circle cx="230" cy="100" r="24" fill="#1F3A5F"/>
  <circle cx="190" cy="164" r="20" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <circle cx="270" cy="164" r="20" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <!-- X is 2 + 1 -->
  <rect x="40" y="276" width="60" height="48" rx="8" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="104" y1="300" x2="190" y2="300" stroke="#2E7D32" stroke-width="3"/>
  <polygon points="186,292 202,300 186,308" fill="#2E7D32"/>
  <rect x="206" y="276" width="60" height="48" rx="8" fill="#E3F1E4" stroke="#2E7D32" stroke-width="2"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="26" text-anchor="middle">
    <text x="70" y="109" fill="#1F2933">X</text>
    <text x="230" y="109" fill="#FFFFFF" font-weight="bold">+</text>
    <text x="190" y="172" fill="#1F2933" font-size="22">2</text>
    <text x="270" y="172" fill="#1F2933" font-size="22">1</text>
    <text x="70" y="309" fill="#1F2933">X</text>
    <text x="236" y="309" fill="#2E7D32" font-weight="bold">3</text>
  </g>
  <g font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" fill="#52606D">
    <text x="266" y="92">un término</text>
    <text x="284" y="306">un número</text>
  </g>
</svg>
