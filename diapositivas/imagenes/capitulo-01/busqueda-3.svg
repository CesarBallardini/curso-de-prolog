<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <title>Búsqueda de abuelo(juan, eva), paso 3: padre(ana, eva) falla y la búsqueda vuelve atrás a buscar otro valor para P</title>
  <rect x="0" y="0" width="400" height="470" fill="#FFFFFF"/>
  <line x1="200" y1="54" x2="200" y2="92" stroke="#1F3A5F" stroke-width="3"/>
  <line x1="150" y1="158" x2="100" y2="228" stroke="#B3261E" stroke-width="3"/>
  <line x1="100" y1="272" x2="100" y2="292" stroke="#B3261E" stroke-width="3"/>
  <rect x="70" y="10" width="260" height="44" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <rect x="40" y="92" width="320" height="66" rx="10" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <rect x="10" y="228" width="180" height="44" rx="10" fill="#FBE4E2" stroke="#B3261E" stroke-width="3"/>
  <circle cx="100" cy="310" r="18" fill="#B3261E"/>
  <path d="M 92 302 L 108 318 M 108 302 L 92 318" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- back to the last choice -->
  <path d="M 190 250 C 250 250 262 214 246 172" fill="none" stroke="#D9822B" stroke-width="3" stroke-dasharray="7 5"/>
  <polygon points="236,178 244,160 256,176" fill="#D9822B"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="20" text-anchor="middle" fill="#1F2933">
    <text x="200" y="38">abuelo(juan, eva)</text>
    <text x="200" y="119">padre(juan, P),</text>
    <text x="200" y="146">padre(P, eva)</text>
    <text x="100" y="256">padre(ana, eva)</text>
  </g>
  <text x="118" y="200" text-anchor="end" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#B3261E">P = ana</text>
  <g font-family="Verdana, DejaVu Sans, sans-serif">
    <text x="210" y="80" font-size="16" fill="#52606D">regla</text>
    <text x="100" y="356" font-size="18" font-weight="bold" fill="#B3261E" text-anchor="middle">falla</text>
    <text x="270" y="214" font-size="18" font-weight="bold" fill="#D9822B">vuelta atrás</text>
  </g>
  <rect x="10" y="378" width="380" height="88" rx="6" fill="#F1F3F5"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#1F2933">
    <text x="22" y="398">Fail: (11) padre(ana, eva)</text>
    <text x="22" y="418">Redo: (11) padre(juan, _)</text>
  </g>
</svg>
