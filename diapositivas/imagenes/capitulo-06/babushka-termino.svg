<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <title>Una babushka de cuatro muñecas como término: tres babushka_hueca, una dentro de otra, y en el centro babushka_maciza</title>
  <rect x="0" y="0" width="800" height="420" fill="#FFFFFF"/>
  <rect x="20" y="20" width="760" height="320" rx="16" fill="#FBE9E7" stroke="#C8342B" stroke-width="3"/>
  <text x="36" y="49" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#C8342B" font-weight="bold">babushka_hueca(</text>
  <text x="764" y="49" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="end">hueca</text>
  <rect x="60" y="62" width="680" height="263" rx="16" fill="#FFFFFF" stroke="#C8342B" stroke-width="3"/>
  <text x="76" y="91" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#C8342B" font-weight="bold">babushka_hueca(</text>
  <text x="724" y="91" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="end">hueca</text>
  <rect x="100" y="104" width="600" height="206" rx="16" fill="#FBE9E7" stroke="#C8342B" stroke-width="3"/>
  <text x="116" y="133" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#C8342B" font-weight="bold">babushka_hueca(</text>
  <text x="684" y="133" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="end">hueca</text>
  <rect x="140" y="146" width="520" height="149" rx="16" fill="#C8342B" stroke="#5A1C17" stroke-width="3"/>
  <text x="400" y="230" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#FFFFFF" font-weight="bold" text-anchor="middle">babushka_maciza</text>
  <text x="400" y="260" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle">maciza</text>
  <text x="400" y="390" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">babushka_hueca(babushka_hueca(babushka_hueca(babushka_maciza)))</text>
</svg>
