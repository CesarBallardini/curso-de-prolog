  <text x="58.0" y="219.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#E4E7EB" text-anchor="start" font-weight="bold" xml:space="preserve">% [3/5] hermana:eva_es_hermana_de_luis ............. passed</text>
  <text x="58.0" y="244.9" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#E4E7EB" text-anchor="start" font-weight="bold" xml:space="preserve">% [4/5] hermana:nadie_es_hermana_de_si_misma ....... passed</text>
  <text x="58.0" y="270.6" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#E4E7EB" text-anchor="start" font-weight="bold" xml:space="preserve">% [5/5] hermana:pedro_no_es_hermana ................ passed</text>
  <text x="58.0" y="296.2" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#E4E7EB" text-anchor="start" font-weight="bold" xml:space="preserve">% All 5 tests passed</text>
