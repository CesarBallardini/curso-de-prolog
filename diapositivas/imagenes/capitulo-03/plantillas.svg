  <text x="508.0" y="54.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" fill="#1F3A5F" text-anchor="start" font-weight="bold" xml:space="preserve">Plantilla 3 — Definir por casos</text>
  <text x="514.0" y="96.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p(X) :-</text>
  <text x="560.2" y="126.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">primer_caso(X).</text>
  <text x="514.0" y="156.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p(X) :-</text>
  <text x="560.2" y="186.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">otro_caso(X).</text>
  <rect x="20.0" y="245.0" width="450.0" height="205.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="38.0" y="279.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" fill="#1F3A5F" text-anchor="start" font-weight="bold" xml:space="preserve">Plantilla 4 — Encadenar dos relaciones</text>
  <text x="44.0" y="321.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">nueva(A, C) :-</text>
