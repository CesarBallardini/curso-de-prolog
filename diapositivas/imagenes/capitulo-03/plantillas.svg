  <text x="320.0" y="401.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#D9822B" text-anchor="start" font-weight="bold" xml:space="preserve">en los dos</text>
  <rect x="490.0" y="245.0" width="450.0" height="205.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="508.0" y="279.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" fill="#1F3A5F" text-anchor="start" font-weight="bold" xml:space="preserve">Plantilla 5 — Generar y después comprobar</text>
  <text x="514.0" y="321.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">nueva(X) :-</text>
  <text x="560.2" y="351.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">candidato(X),</text>
