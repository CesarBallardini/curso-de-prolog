  <text x="240.0" y="43.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1F2933" text-anchor="middle" xml:space="preserve">progenitor(Quien, sofia)</text>
  <line x1="200.0" y1="60.0" x2="120.0" y2="140.0" stroke="#9AA5B1" stroke-width="3"/>
