  <text x="120.0" y="172.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#52606D" text-anchor="middle" xml:space="preserve">padre(Quien, sofia)</text>
  <rect x="250.0" y="140.0" width="220.0" height="50.0" rx="10" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
