  <text x="24.0" y="51.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#1F2933" text-anchor="start" xml:space="preserve">padre(juan, ana).</text>
  <line x1="244.0" y1="44.0" x2="290.0" y2="44.0" stroke="#1F3A5F" stroke-width="3" marker-end="url(#a-navy)"/>
