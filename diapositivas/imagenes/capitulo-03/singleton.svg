  <text x="46.0" y="420.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="22" fill="#C62828" text-anchor="start" font-weight="bold" xml:space="preserve">corregirlo</text>
  <rect x="340.0" y="350.0" width="290.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="354.0" y="382.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#1F2933" text-anchor="start" xml:space="preserve">el valor no interesa</text>
  <text x="356.0" y="420.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#2E7D32" text-anchor="start" font-weight="bold" xml:space="preserve">_</text>
  <rect x="650.0" y="350.0" width="290.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="664.0" y="382.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#1F2933" text-anchor="start" xml:space="preserve">no interesa, y el nombre informa</text>
  <text x="666.0" y="420.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#2E7D32" text-anchor="start" font-weight="bold" xml:space="preserve">_Hijo</text>
</svg>
