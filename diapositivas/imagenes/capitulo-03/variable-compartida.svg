<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490">
  <title>Que aparece en los dos objetivos: debe ser algo que le guste a ana y también a luis; lo único en común es futbol</title>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2933"/></marker>
    <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9822B"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA5B1"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="490" fill="#FFFFFF"/>
  <rect x="367.0" y="75.4" width="57.5" height="36.0" rx="6" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <rect x="664.0" y="75.4" width="57.5" height="36.0" rx="6" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <text x="140.0" y="100.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="30" fill="#1F2933" text-anchor="start" xml:space="preserve">?- gusta(ana, Que), gusta(luis, Que).</text>
  <path d="M395.8,70 C395.8,40 692.8,40 692.8,70" fill="none" stroke="#D9822B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="544.2" y="30.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#D9822B" text-anchor="middle" font-weight="bold" xml:space="preserve">la misma variable: el mismo valor en los dos objetivos</text>
  <g transform="translate(0,30)">
  <rect x="60.0" y="130.0" width="360.0" height="250.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="240.0" y="166.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="20" fill="#1F3A5F" text-anchor="middle" font-weight="bold" xml:space="preserve">a ana le gusta</text>
  <rect x="90.0" y="190.0" width="300.0" height="50.0" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="240.0" y="223.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle" xml:space="preserve">prolog</text>
  <rect x="90.0" y="256.0" width="300.0" height="50.0" rx="8" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="240.0" y="289.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="bold" xml:space="preserve">futbol</text>
  <rect x="540.0" y="130.0" width="360.0" height="250.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="720.0" y="166.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="20" fill="#1F3A5F" text-anchor="middle" font-weight="bold" xml:space="preserve">a luis le gusta</text>
  <rect x="570.0" y="256.0" width="300.0" height="50.0" rx="8" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="720.0" y="289.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle" font-weight="bold" xml:space="preserve">futbol</text>
  <line x1="392.0" y1="281.0" x2="566.0" y2="281.0" stroke="#2E7D32" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="480.0" y="270.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold" xml:space="preserve">en común</text>
  <rect x="330.0" y="400.0" width="300.0" height="47.7" rx="8" fill="#1F2933" stroke="#1F2933" stroke-width="2"/>
  <text x="348.0" y="431.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#E4E7EB" text-anchor="start" font-weight="bold" xml:space="preserve">Que = futbol.</text>
