  <text x="100" y="158" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">padre(juan, ana).</text>
  <text x="100" y="194" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">padre(juan, pedro).</text>
  <text x="100" y="230" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">padre(pedro, luis).</text>
  <text x="100" y="266" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">padre(pedro, eva).</text>
  <text x="100" y="302" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">madre(marta, ana).</text>
  <text x="100" y="338" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">madre(marta, pedro).</text>
  <text x="100" y="374" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="20" fill="#1f2933" text-anchor="start" font-weight="normal" font-style="normal">madre(eva, sofia).</text>
  <rect x="90" y="352" width="250" height="30" rx="4" ry="4" fill="none" stroke="#b7791f" stroke-width="2.5"/>
  <rect x="720" y="120" width="60" height="60" rx="3" ry="3" fill="#ffffff" stroke="#7b8794" stroke-width="2.5" stroke-dasharray="7 5"/>
