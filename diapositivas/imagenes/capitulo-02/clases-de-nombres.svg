<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t">
  <title id="t">Átomos (juan, prolog, Ana entre comillas), números (68, 3.5) y variables (Ana, Quien, X, guion bajo)</title>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fa8"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/></marker>
    <marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a3d9a"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <rect x="40" y="30" width="270" height="330" rx="14" ry="14" fill="#e3edf8" stroke="#1d5fa8" stroke-width="2.5"/>
  <text x="175" y="70" font-family="'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1d5fa8" text-anchor="middle" font-weight="bold" font-style="normal">átomos</text>
  <text x="175" y="125" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">juan</text>
  <text x="175" y="180" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">prolog</text>
  <text x="175" y="235" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">'Ana'</text>
  <text x="175" y="290" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">'mi amigo'</text>
  <text x="175" y="395" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7b8794" text-anchor="middle" font-weight="normal" font-style="normal">minúscula, o entre comillas simples</text>
  <rect x="340" y="30" width="270" height="330" rx="14" ry="14" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/>
  <text x="475" y="70" font-family="'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#b7791f" text-anchor="middle" font-weight="bold" font-style="normal">números</text>
  <text x="475" y="125" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">68</text>
  <text x="475" y="180" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">3.5</text>
  <text x="475" y="395" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7b8794" text-anchor="middle" font-weight="normal" font-style="normal">sin comillas; tienen valor</text>
  <rect x="640" y="30" width="270" height="330" rx="14" ry="14" fill="#f0e8f7" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="775" y="70" font-family="'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#6a3d9a" text-anchor="middle" font-weight="bold" font-style="normal">variables</text>
  <text x="775" y="125" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">Ana</text>
  <text x="775" y="180" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">Quien</text>
  <text x="775" y="235" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">X</text>
  <text x="775" y="290" font-family="'DejaVu Sans Mono', 'Cascadia Mono', monospace" font-size="28" fill="#1f2933" text-anchor="middle" font-weight="bold" font-style="normal">_</text>
  <text x="775" y="395" font-family="'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#7b8794" text-anchor="middle" font-weight="normal" font-style="normal">mayúscula o guion bajo</text>
  <rect x="115" y="203" width="120" height="34" rx="6" ry="6" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="715" y="93" width="120" height="34" rx="6" ry="6" fill="none" stroke="#c62828" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="480" y="440" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c62828" text-anchor="middle" font-weight="normal" font-style="normal">'Ana' con comillas es un átomo; Ana sin comillas, una variable</text>
</svg>
