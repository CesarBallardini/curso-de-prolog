  <text x="145.7" y="281.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">R1. θ₂ =</text>
  <text x="145.7" y="305.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">{ Quien/ana }</text>
  </g>
  <g class="elabel">
