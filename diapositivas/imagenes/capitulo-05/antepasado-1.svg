  <rect x="142.1" y="188.8" width="235.9" height="42.4" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="260.0" y="217.5" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">padre(juan, Quien)</text>
  <rect x="613.2" y="174.7" width="293.7" height="70.7" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="760.0" y="203.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#9AA5B1" text-anchor="middle" xml:space="preserve">padre(juan, Hijo),</text>
  <text x="760.0" y="231.6" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#9AA5B1" text-anchor="middle" xml:space="preserve">antepasado(Hijo, Quien)</text>
  <line x1="760.0" y1="245.3" x2="760.0" y2="267.4" stroke="#9AA5B1" stroke-width="2.5" stroke-dasharray="5 4"/>
