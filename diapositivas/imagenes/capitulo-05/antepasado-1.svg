  <text x="379.8" y="281.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">R2. θ₃ =</text>
  <text x="379.8" y="305.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">{ Quien/pedro }</text>
