  <rect x="10.4" y="334.0" width="199.3" height="72.0" rx="12" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="110.0" y="362.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">1.ª respuesta</text>
  <text x="110.0" y="392.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve" font-weight="bold">Quien = ana</text>
  <rect x="320.4" y="334.0" width="199.3" height="72.0" rx="12" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="420.0" y="362.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">2.ª respuesta</text>
