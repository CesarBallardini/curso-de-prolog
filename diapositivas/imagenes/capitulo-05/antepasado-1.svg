<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Árbol de antepasado(juan, Quien), 1 de 3: R4 da las dos primeras respuestas, ana y pedro; la rama de R5 continúa</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <text x="20" y="30" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start">R4: caso base · R5: caso recursivo</text>
  <line x1="511.9" y1="73.2" x2="260.0" y2="188.8" stroke="#1F3A5F" stroke-width="3"/>
  <line x1="688.1" y1="73.2" x2="760.0" y2="174.7" stroke="#1F3A5F" stroke-width="3"/>
