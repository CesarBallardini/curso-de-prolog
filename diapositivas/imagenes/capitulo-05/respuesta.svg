  <polygon points="489.0,290.0 495.6,278.0 482.4,278.0" fill="#2E7D32"/>
  <text x="504.0" y="262.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">las variables de la consulta</text>
  <rect x="369.0" y="300.0" width="240.0" height="64.0" rx="8" fill="#1F2933"/>
  <text x="489.0" y="341.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#E4E7EB" text-anchor="middle" xml:space="preserve" font-weight="bold">Quien = luis.</text>
</svg>
