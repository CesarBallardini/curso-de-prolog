<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Dos lecturas de un programa: como afirmación lógica las dos versiones dicen lo mismo; como procedimiento una termina y la otra no</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <text x="470.0" y="30.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F3A5F" text-anchor="middle" xml:space="preserve" font-weight="bold">recursión primero</text>
  <text x="780.0" y="30.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F3A5F" text-anchor="middle" xml:space="preserve" font-weight="bold">avance primero</text>
  <text x="470.0" y="60.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">antepasado(A, X),</text>
  <text x="470.0" y="84.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">padre(X, D)</text>
  <text x="780.0" y="60.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">padre(A, Hijo),</text>
  <text x="780.0" y="84.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">antepasado(Hijo, D)</text>
  <rect x="20.0" y="104.0" width="920.0" height="150.0" rx="12" fill="#F7F9FB" stroke="#EAF1F8" stroke-width="2"/>
  <text x="40.0" y="172.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="22" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">lectura lógica</text>
  <text x="40.0" y="202.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">lo que afirma</text>
  <rect x="20.0" y="266.0" width="920.0" height="150.0" rx="12" fill="#F7F9FB" stroke="#EAF1F8" stroke-width="2"/>
  <text x="40.0" y="334.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="22" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">lectura procedimental</text>
  <text x="40.0" y="364.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">lo que se ejecuta</text>
  <circle cx="470" cy="162" r="22" fill="#2E7D32"/>
  <path d="M 459.0 163.22222222222223 L 467.55555555555554 171.77777777777777 L 482.22222222222223 152.22222222222223" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="780" cy="162" r="22" fill="#2E7D32"/>
  <path d="M 769.0 163.22222222222223 L 777.5555555555555 171.77777777777777 L 792.2222222222222 152.22222222222223" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="625.0" y="174.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="34" fill="#1F3A5F" text-anchor="middle" xml:space="preserve" font-weight="bold">=</text>
  <text x="470.0" y="218.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">correcto</text>
  <text x="780.0" y="218.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">correcto</text>
  <text x="470.0" y="348.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="46" fill="#B3261E" text-anchor="middle" xml:space="preserve" font-weight="bold">∞</text>
  <text x="470.0" y="384.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#B3261E" text-anchor="middle" xml:space="preserve" font-weight="bold">no termina</text>
  <circle cx="780" cy="328" r="22" fill="#2E7D32"/>
  <path d="M 769.0 329.22222222222223 L 777.5555555555555 337.77777777777777 L 792.2222222222222 318.22222222222223" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="780.0" y="384.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">termina</text>
  <text x="480.0" y="456.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve" font-style="italic">el orden no cambia lo que se afirma; decide lo que se ejecuta</text>
</svg>
