<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Resolución en dos operaciones: se reemplaza el objetivo por el cuerpo de la cláusula y se aplica la sustitución a todos los objetivos que quedan</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <text x="46.0" y="34.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">objetivo</text>
  <rect x="46.3" y="50.8" width="247.5" height="42.4" rx="10" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <text x="170.0" y="79.5" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">abuelo(juan, Quien)</text>
  <text x="570.0" y="34.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">cabeza de R4</text>
  <text x="570.0" y="80.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" xml:space="preserve"><tspan fill="#1F2933" font-weight="bold">abuelo(A, N)</tspan><tspan fill="#9AA5B1"> :- ...</tspan></text>
  <line x1="300.0" y1="72.0" x2="543.0" y2="72.0" stroke="#1F3A5F" stroke-width="2.5"/>
  <polygon points="555.0,72.0 543.0,65.4 543.0,78.6" fill="#1F3A5F"/>
  <text x="428.0" y="60.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve">unifican</text>
  <text x="334.8" y="142.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve"><tspan fill="#1F2933">θ₁ = { </tspan><tspan fill="#6A3D9A" font-weight="bold">A/juan</tspan><tspan fill="#1F2933">, </tspan><tspan fill="#0B6E75" font-weight="bold">N/Quien</tspan><tspan fill="#1F2933"> }</tspan></text>
  <circle cx="60" cy="200" r="16" fill="#1F3A5F"/>
  <text x="60.0" y="207.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">1</text>
  <text x="88.0" y="208.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">se reemplaza el objetivo por el cuerpo de R4</text>
  <rect x="90.0" y="226.0" width="780.0" height="52.0" rx="10" fill="#F1F3F5"/>
  <text x="334.8" y="260.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve"><tspan fill="#1F2933">padre(</tspan><tspan fill="#6A3D9A" font-weight="bold">A</tspan><tspan fill="#1F2933">, P), padre(P, </tspan><tspan fill="#0B6E75" font-weight="bold">N</tspan><tspan fill="#1F2933">)</tspan></text>
  <circle cx="60" cy="326" r="16" fill="#1F3A5F"/>
  <text x="60.0" y="333.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">2</text>
  <text x="88.0" y="334.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">se aplica θ₁ a todos los objetivos que quedan</text>
  <rect x="90.0" y="352.0" width="780.0" height="52.0" rx="10" fill="#FCE8D2" stroke="#D9822B" stroke-width="2"/>
  <text x="292.4" y="386.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" xml:space="preserve"><tspan fill="#1F2933">padre(</tspan><tspan fill="#6A3D9A" font-weight="bold">juan</tspan><tspan fill="#1F2933">, P), padre(P, </tspan><tspan fill="#0B6E75" font-weight="bold">Quien</tspan><tspan fill="#1F2933">)</tspan></text>
  <line x1="480.0" y1="280.0" x2="480.0" y2="290.0" stroke="#9AA5B1" stroke-width="2.5"/>
  <polygon points="480.0,300.0 485.5,290.0 474.5,290.0" fill="#9AA5B1"/>
  <text x="480.0" y="448.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="middle" xml:space="preserve" font-style="italic">el nodo hijo del árbol</text>
</svg>
