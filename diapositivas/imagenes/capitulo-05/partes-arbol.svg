  <line x1="484.0" y1="387.0" x2="148.0" y2="395.0" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="144" cy="395" r="4" fill="#9AA5B1"/>
