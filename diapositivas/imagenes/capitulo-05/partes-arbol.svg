<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Partes de un árbol de derivación: los nodos son consultas, los arcos llevan la cláusula y la sustitución, la consulta vacía es un éxito y un objetivo sin cabeza que unifique es una falla</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
