  <text x="40.0" y="196.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">Call (10)</text>
  <text x="810.0" y="196.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#2E7D32" text-anchor="start" xml:space="preserve" font-weight="bold">Exit (10)</text>
  <text x="40.0" y="318.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#B3261E" text-anchor="start" xml:space="preserve" font-weight="bold">Fail (10)</text>
