<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>El recorrido de abuelo(juan, Quien) por las cajas: con P = ana la segunda caja falla y se reentra por Redo; con P = pedro se sale por Exit con Quien = luis</title>
