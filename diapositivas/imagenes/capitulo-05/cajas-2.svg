  <text x="66.0" y="400.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">Call (10): se entra a la primera caja</text>
  <circle cx="40" cy="425" r="16" fill="#D9822B"/>
  <text x="40.0" y="432.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">2</text>
  <text x="66.0" y="433.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">P = ana; padre(ana, Quien) falla: Redo en la primera caja</text>
  <circle cx="40" cy="458" r="16" fill="#2E7D32"/>
  <text x="40.0" y="465.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">3</text>
  <text x="66.0" y="466.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">P = pedro; padre(pedro, Quien) da Quien = luis: Exit (10)</text>
