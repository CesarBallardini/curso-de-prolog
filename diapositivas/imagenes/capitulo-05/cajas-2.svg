  <circle cx="760" cy="240" r="16" fill="#2E7D32"/>
  <text x="760.0" y="247.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">3</text>
