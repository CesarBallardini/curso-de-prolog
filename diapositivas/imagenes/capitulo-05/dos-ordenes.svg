  <text x="40.0" y="60.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">objetivos</text>
  <text x="40.0" y="90.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">de izquierda a derecha</text>
  <text x="510.0" y="60.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">cláusulas</text>
  <text x="510.0" y="90.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">de arriba hacia abajo</text>
  <rect x="33.1" y="174.8" width="189.7" height="42.4" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
