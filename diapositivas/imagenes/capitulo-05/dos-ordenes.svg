  <polygon points="530.0,326.0 538.8,310.0 521.2,310.0" fill="#D9822B"/>
  <text x="20.0" y="396.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">y si un objetivo falla:</text>
