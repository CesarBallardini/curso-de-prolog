  <circle cx="350" cy="150" r="16" fill="#D9822B"/>
  <text x="350.0" y="157.6" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#FFFFFF" text-anchor="middle" xml:space="preserve" font-weight="bold">2</text>
