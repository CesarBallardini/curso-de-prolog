<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Las dos reglas del orden: los objetivos se prueban de izquierda a derecha y las cláusulas se prueban de arriba hacia abajo</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <rect x="20.0" y="20.0" width="450.0" height="330.0" rx="12" fill="#F7F9FB" stroke="#EAF1F8" stroke-width="2"/>
