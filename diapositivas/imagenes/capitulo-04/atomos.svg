<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>Tres maneras de escribir un átomo: con minúscula inicial, entre comillas simples y como símbolo</title>
  <rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/>
  <rect x="20" y="20" width="220" height="360" rx="12" fill="#F1F3F5"/>
  <text x="130" y="58" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#1F3A5F" text-anchor="middle" font-weight="bold">minúscula inicial</text>
  <rect x="255" y="20" width="290" height="360" rx="12" fill="#F1F3F5"/>
  <text x="400" y="58" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#1F3A5F" text-anchor="middle" font-weight="bold">entre comillas</text>
  <rect x="560" y="20" width="220" height="360" rx="12" fill="#F1F3F5"/>
  <text x="670" y="58" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#1F3A5F" text-anchor="middle" font-weight="bold">símbolos</text>
  <rect x="100.5" y="102" width="59" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="130" y="127" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1F2933" text-anchor="middle">ana</text>
  <rect x="62" y="164" width="136" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="130" y="189" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1F2933" text-anchor="middle">gato_persa</text>
  <rect x="89.5" y="226" width="81" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="130" y="251" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="20" fill="#1F2933" text-anchor="middle">casa2</text>
  <text x="130" y="330" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="middle">letras, dígitos y _</text>
  <rect x="278.1" y="102" width="243.8" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="400" y="126.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">'consulta veterinaria'</text>
  <rect x="347.4" y="164" width="105.2" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="400" y="188.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">'Hola, '</text>
  <rect x="362.25" y="226" width="75.5" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="400" y="250.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">'Ana'</text>
  <text x="400" y="318" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="middle">cualquier carácter</text>
  <text x="400" y="345" font-family="Verdana, DejaVu Sans, sans-serif" font-size="13" fill="#52606D" text-anchor="middle">sin comillas, Ana es una variable</text>
  <rect x="590" y="102" width="40" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="610" y="127.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">+</text>
  <rect x="650" y="102" width="40" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="670" y="127.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">-</text>
  <rect x="710" y="102" width="40" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="730" y="127.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">*</text>
  <rect x="620" y="164" width="40" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="640" y="189.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">=</text>
  <rect x="680" y="164" width="40" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="700" y="189.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">&lt;</text>
  <text x="670" y="330" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#52606D" text-anchor="middle">también son átomos</text>
</svg>
