<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <title>El árbol de 1 + 2 + 3: la raíz + tiene como primer argumento la suma 1 + 2 y como segundo el número 3</title>
  <rect x="0" y="0" width="400" height="350" fill="#FFFFFF"/>
  <text x="200" y="40" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="28" fill="#1F2933" text-anchor="middle">1 + 2 + 3</text>
  <rect x="40" y="160" width="200" height="150" rx="14" fill="#FCE8D2" stroke="#D9822B" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="290" y="160" width="80" height="60" rx="14" fill="#FCE8D2" stroke="#D9822B" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="230" y1="100" x2="140" y2="190" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="140" y1="190" x2="90" y2="280" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="140" y1="190" x2="190" y2="280" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="230" y1="100" x2="330" y2="190" stroke="#1F3A5F" stroke-width="2"/>
  <circle cx="230" cy="100" r="22" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/>
  <text x="230" y="108.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+</text>
  <circle cx="140" cy="190" r="22" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/>
  <text x="140" y="198.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#FFFFFF" text-anchor="middle" font-weight="bold">+</text>
  <rect x="70" y="262" width="40" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="90" y="288.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">1</text>
  <rect x="170" y="262" width="40" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="190" y="288.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">2</text>
  <rect x="310" y="172" width="40" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="330" y="198.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">3</text>
  <text x="140" y="336" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#D9822B" text-anchor="middle" font-weight="bold">Izquierda</text>
  <text x="330" y="250" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#D9822B" text-anchor="middle" font-weight="bold">Derecha</text>
</svg>
