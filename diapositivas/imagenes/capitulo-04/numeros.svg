<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <title>Los números: enteros como 12, -7 y 0, y de punto flotante como 3.5 y -0.25</title>
  <rect x="0" y="0" width="400" height="350" fill="#FFFFFF"/>
  <rect x="15" y="15" width="175" height="320" rx="12" fill="#F1F3F5"/>
  <rect x="210" y="15" width="175" height="320" rx="12" fill="#F1F3F5"/>
  <text x="102" y="50" font-family="Verdana, DejaVu Sans, sans-serif" font-size="18" fill="#2B7A78" text-anchor="middle" font-weight="bold">enteros</text>
  <text x="297" y="50" font-family="Verdana, DejaVu Sans, sans-serif" font-size="17" fill="#2B7A78" text-anchor="middle" font-weight="bold">punto flotante</text>
  <rect x="75.8" y="92" width="52.4" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="102" y="118.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">12</text>
  <rect x="75.8" y="154" width="52.4" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="102" y="180.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">-7</text>
  <rect x="82" y="216" width="40" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="102" y="242.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">0</text>
  <rect x="264.2" y="92" width="65.6" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="297" y="118.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">3.5</text>
  <rect x="251" y="154" width="92" height="36" rx="18" fill="#E3F2F1" stroke="#2B7A78" stroke-width="2"/>
  <text x="297" y="180.4" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="24" fill="#1F2933" text-anchor="middle">-0.25</text>
  <text x="297" y="300" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#52606D" text-anchor="middle">el punto separa</text>
  <text x="297" y="320" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#52606D" text-anchor="middle">la parte decimal</text>
</svg>
