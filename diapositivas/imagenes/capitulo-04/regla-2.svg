<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>Regla 2: una variable libre unifica con una constante, con un término compuesto o con otra variable, y queda ligada</title>
  <rect x="0" y="0" width="800" height="400" fill="#FFFFFF"/>
  <rect x="18" y="20" width="244" height="360" rx="12" fill="#F1F3F5"/>
  <text x="140" y="52" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="bold">con una constante</text>
  <rect x="278" y="20" width="244" height="360" rx="12" fill="#F1F3F5"/>
  <text x="400" y="52" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="bold">con un compuesto</text>
  <rect x="538" y="20" width="244" height="360" rx="12" fill="#F1F3F5"/>
  <text x="660" y="52" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#52606D" text-anchor="middle" font-weight="bold">con otra variable</text>
  <rect x="84.65" y="87" width="110.7" height="36" rx="6" fill="#EFE7F7" stroke="#6A3D9A" stroke-width="2"/>
  <text x="140" y="112.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">Especie</text>
  <text x="140" y="170" font-family="Verdana, DejaVu Sans, sans-serif" font-size="32" fill="#52606D" text-anchor="middle" font-weight="bold">=</text>
  <rect x="102.8" y="207" width="74.4" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="140" y="232.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">gato</text>
  <text x="140" y="340" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#2E7D32" text-anchor="middle" font-weight="bold">Especie = gato</text>
  <rect x="370" y="87" width="60" height="36" rx="6" fill="#EFE7F7" stroke="#6A3D9A" stroke-width="2"/>
  <text x="400" y="112.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">X</text>
  <text x="400" y="170" font-family="Verdana, DejaVu Sans, sans-serif" font-size="32" fill="#52606D" text-anchor="middle" font-weight="bold">=</text>
  <line x1="400" y1="215" x2="345" y2="285" stroke="#1F3A5F" stroke-width="2"/>
  <line x1="400" y1="215" x2="455" y2="285" stroke="#1F3A5F" stroke-width="2"/>
  <ellipse cx="400" cy="215" rx="52.65" ry="20" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/>
  <text x="400" y="221.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="bold">mascota</text>
  <rect x="312.2" y="267" width="65.6" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="345" y="291.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">gato</text>
  <rect x="417.25" y="267" width="75.5" height="36" rx="18" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="2"/>
  <text x="455" y="291.3" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#1F2933" text-anchor="middle">felix</text>
  <text x="400" y="340" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#2E7D32" text-anchor="middle" font-weight="bold">X = mascota(gato, felix)</text>
  <rect x="630" y="87" width="60" height="36" rx="6" fill="#EFE7F7" stroke="#6A3D9A" stroke-width="2"/>
  <text x="660" y="112.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">X</text>
  <text x="660" y="170" font-family="Verdana, DejaVu Sans, sans-serif" font-size="32" fill="#52606D" text-anchor="middle" font-weight="bold">=</text>
  <rect x="630" y="207" width="60" height="36" rx="6" fill="#EFE7F7" stroke="#6A3D9A" stroke-width="2"/>
  <text x="660" y="232.7" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#1F2933" text-anchor="middle">Y</text>
  <path d="M690,105 C740,105 740,225 690,225" fill="none" stroke="#6A3D9A" stroke-width="3"/>
  <text x="660" y="330" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#6A3D9A" text-anchor="middle" font-weight="bold">la misma variable,</text>
  <text x="660" y="352" font-family="Verdana, DejaVu Sans, sans-serif" font-size="15" fill="#6A3D9A" text-anchor="middle">todavía sin valor</text>
</svg>
