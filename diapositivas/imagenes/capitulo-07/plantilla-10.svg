<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Plantilla 10, buscar un elemento que cumple: la primera cláusula tiene éxito en cuanto uno cumple; sobre la lista vacía no hay cláusula y la búsqueda fracasa</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <rect x="10.0" y="16.0" width="520.0" height="108.0" rx="12" fill="#FBE4E2" stroke="#B3261E" stroke-width="3"/>
  <text x="34.0" y="58.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p([Primero|_]) :-</text>
  <text x="34.0" y="92.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">    cumple(Primero).</text>
  <rect x="10.0" y="146.0" width="520.0" height="108.0" rx="12" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <text x="34.0" y="188.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p([_|Resto]) :-</text>
  <text x="34.0" y="222.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">    p(Resto).</text>
  <text x="560.0" y="52.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#B3261E" text-anchor="start" xml:space="preserve" font-weight="bold">éxito sin recursión</text>
  <text x="560.0" y="86.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">en cuanto uno cumple</text>
  <text x="560.0" y="182.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#D9822B" text-anchor="start" xml:space="preserve" font-weight="bold">caso recursivo</text>
  <text x="560.0" y="216.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">sigue con el resto</text>
  <rect x="10.0" y="276.0" width="940.0" height="98.0" rx="10" fill="#F1F3F5"/>
  <text x="34.0" y="318.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">Sobre [] no hay cláusula aplicable: ninguno cumplió.</text>
  <text x="34.0" y="352.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">Una respuesta por cada elemento que cumple.</text>
</svg>
