<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Construcción en la cabeza: cada llamada de pegar fija el primer elemento del resultado y deja el resto sin determinar, hasta que el caso base cierra la lista</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <text x="40.0" y="34.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">llamada</text>
  <text x="500.0" y="34.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">la cabeza fija</text>
  <text x="730.0" y="34.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">Todos, hasta aquí</text>
  <rect x="20.0" y="56.0" width="450.0" height="56.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="3"/>
  <text x="245.0" y="92.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">pegar([ana, luis], [eva], Todos)</text>
  <text x="500.0" y="92.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">Todos = [ana|R1]</text>
  <rect x="730.0" y="56.0" width="210.0" height="56.0" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="835.0" y="92.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">[ana|R1]</text>
  <rect x="20.0" y="174.0" width="450.0" height="56.0" rx="10" fill="#EAF1F8" stroke="#1F3A5F" stroke-width="3"/>
  <text x="245.0" y="210.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">pegar([luis], [eva], R1)</text>
  <text x="500.0" y="210.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">R1 = [luis|R2]</text>
  <rect x="730.0" y="174.0" width="210.0" height="56.0" rx="4" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="835.0" y="210.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">[ana, luis|R2]</text>
  <line x1="245.0" y1="114.0" x2="245.0" y2="160.0" stroke="#1F3A5F" stroke-width="3"/>
  <polygon points="245.0,172.0 251.6,160.0 238.4,160.0" fill="#1F3A5F"/>
  <rect x="20.0" y="292.0" width="450.0" height="56.0" rx="10" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <text x="245.0" y="328.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">pegar([], [eva], R2)</text>
  <text x="500.0" y="328.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">R2 = [eva]</text>
  <rect x="730.0" y="292.0" width="210.0" height="56.0" rx="4" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="835.0" y="328.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve" font-weight="bold">[ana, luis, eva]</text>
  <line x1="245.0" y1="232.0" x2="245.0" y2="278.0" stroke="#1F3A5F" stroke-width="3"/>
  <polygon points="245.0,290.0 251.6,278.0 238.4,278.0" fill="#1F3A5F"/>
  <rect x="20.0" y="410.0" width="920.0" height="56.0" rx="10" fill="#F1F3F5"/>
  <text x="480.0" y="446.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">lista incompleta en cada paso; el caso base la cierra</text>
</svg>
