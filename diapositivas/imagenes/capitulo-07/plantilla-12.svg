<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>Plantilla 12, construir una lista durante el recorrido de otra: el resultado se escribe en la cabeza, y cada llamada aporta su primer elemento</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <rect x="10.0" y="16.0" width="520.0" height="74.0" rx="12" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="34.0" y="58.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p([], CasoBase).</text>
  <rect x="10.0" y="112.0" width="520.0" height="142.0" rx="12" fill="#FCE8D2" stroke="#D9822B" stroke-width="3"/>
  <text x="34.0" y="154.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">p([X|Resto], [Y|RestoNuevo]) :-</text>
  <text x="34.0" y="188.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">    relacionar(X, Y),</text>
  <text x="34.0" y="222.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">    p(Resto, RestoNuevo).</text>
  <text x="560.0" y="52.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#2E7D32" text-anchor="start" xml:space="preserve" font-weight="bold">caso base</text>
  <text x="560.0" y="86.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">qué resultado</text>
  <text x="560.0" y="113.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">corresponde a []</text>
  <text x="560.0" y="177.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#D9822B" text-anchor="start" xml:space="preserve" font-weight="bold">caso recursivo</text>
  <text x="560.0" y="211.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">el resultado va en la cabeza:</text>
  <text x="560.0" y="238.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">cada llamada aporta</text>
  <text x="560.0" y="265.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#52606D" text-anchor="start" xml:space="preserve">el primer elemento</text>
  <rect x="10.0" y="299.0" width="940.0" height="98.0" rx="10" fill="#F1F3F5"/>
  <text x="34.0" y="341.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">Cambian el caso base y la relación entre cada elemento</text>
  <text x="34.0" y="375.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">y el que ocupa su lugar en el resultado.</text>
</svg>
