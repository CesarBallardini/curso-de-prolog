<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <title>El límite de los varios sentidos: cada predicado termina si la lista que recorre está completa; con ella sin determinar, produce respuestas sin fin</title>
  <rect x="0" y="0" width="960" height="480" fill="#FFFFFF"/>
  <rect x="10.0" y="10.0" width="940.0" height="60.0" rx="8" fill="#EAF1F8"/>
  <text x="30.0" y="49.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F3A5F" text-anchor="start" xml:space="preserve" font-weight="bold">predicado</text>
  <text x="230.0" y="49.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#2E7D32" text-anchor="start" xml:space="preserve" font-weight="bold">termina si…</text>
  <text x="600.0" y="49.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#B3261E" text-anchor="start" xml:space="preserve" font-weight="bold">sin fin si…</text>
  <line x1="10.0" y1="176.0" x2="950.0" y2="176.0" stroke="#9AA5B1" stroke-width="2"/>
  <text x="30.0" y="120.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve" font-weight="bold">pegar/3</text>
  <text x="230.0" y="120.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la 1.ª o la 3.ª lista</text>
  <text x="230.0" y="150.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">está completa</text>
  <text x="600.0" y="120.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la 1.ª y la 3.ª</text>
  <text x="600.0" y="150.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">están sin determinar</text>
  <line x1="10.0" y1="278.0" x2="950.0" y2="278.0" stroke="#9AA5B1" stroke-width="2"/>
  <text x="30.0" y="222.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve" font-weight="bold">esta_en/2</text>
  <text x="230.0" y="222.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la lista está completa</text>
  <text x="600.0" y="222.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la lista está</text>
  <text x="600.0" y="252.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">sin determinar</text>
  <line x1="10.0" y1="380.0" x2="950.0" y2="380.0" stroke="#9AA5B1" stroke-width="2"/>
  <text x="30.0" y="324.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve" font-weight="bold">ultimo/2</text>
  <text x="230.0" y="324.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la lista está completa</text>
  <text x="600.0" y="324.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">la lista está</text>
  <text x="600.0" y="354.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="start" xml:space="preserve">sin determinar</text>
  <rect x="10.0" y="396.0" width="940.0" height="74.0" rx="10" fill="#F1F3F5"/>
  <text x="480.0" y="442.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">antes de un sentido nuevo: ¿qué recorre, y es finito?</text>
</svg>
