  <text x="468.0" y="400.0" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve" font-weight="bold">esta_en/2</text>
  <rect x="628.0" y="12.0" width="296.0" height="456.0" rx="12" fill="#E3F1E4" stroke="#2E7D32" stroke-width="3"/>
  <text x="776.0" y="56.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="24" fill="#2E7D32" text-anchor="middle" xml:space="preserve" font-weight="bold">11 · todos</text>
  <text x="776.0" y="120.0" font-family="Verdana, DejaVu Sans, sans-serif" font-size="21" fill="#1F2933" text-anchor="middle" xml:space="preserve">todos cumplen</text>
  <line x1="648.0" y1="190.0" x2="904.0" y2="190.0" stroke="#2E7D32" stroke-width="2"/>
