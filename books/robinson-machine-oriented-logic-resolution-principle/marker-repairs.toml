# Repairs of the Marker conversion of Robinson (1965), applied by tools/marker2md.py.
# Every repair was checked against the page images of the scan.
#
# How the conversion was made (2026-10-28), from the repository root, in Git Bash:
#
# 1. A text layer that keeps the page boundaries (Tesseract in C:/Program Files/Tesseract-OCR on
#    PATH; pypdfium because Ghostscript is not installed):
#
#      uvx ocrmypdf -f -l eng --rasterizer pypdfium --output-type pdf --oversample 400 \
#          --sidecar robinson.txt books/robinson-machine-oriented-logic-resolution-principle.pdf robinson-ocr.pdf
#
# 2. Marker, in a short directory (Windows limits paths to 260 characters), on the CPU, with small
#    batches and a 12 GB cap on the memory of the whole job (procgov; its --maxws needs an elevated
#    shell). It ran in the author's own terminal: about 1 h 20 min, 8.5 GB at its peak.
#
#      cp books/robinson-machine-oriented-logic-resolution-principle.pdf "$DIR/r.pdf"; cd "$DIR"
#      PYTHONIOENCODING=utf-8 TORCH_DEVICE=cpu RECOGNITION_BATCH_SIZE=4 DETECTOR_BATCH_SIZE=2 \
#          LAYOUT_BATCH_SIZE=2 TEXIFY_BATCH_SIZE=2 TABLE_REC_BATCH_SIZE=2 OCR_ERROR_BATCH_SIZE=2 \
#          procgov --maxjobmem 12G -- 'C:\Users\cesar\.local\bin\uvx.exe' --python 3.12 \
#          --from 'marker-pdf<2' marker_single r.pdf --output_format markdown --output_dir . \
#          --force_ocr --disable_image_extraction
#
#    Marker 1.10.2 with surya-ocr 0.17.1 wrote r/r.md.
#
# 3. This file and the two outputs:
#
#      uv run tools/marker2md.py "$DIR/r/r.md" robinson.txt \
#          books/robinson-machine-oriented-logic-resolution-principle/00-robinson-machine-oriented-logic-resolution-principle.md \
#          --repairs books/robinson-machine-oriented-logic-resolution-principle/marker-repairs.toml

page_offset = 22
running_head = '^\s*(?:\d+\s+)?(?:J\.\s*A\.\s*ROBINSON|THE RESOLUTION PRINCIPLE)'
bold_labels = true

[header]
intro = '''
**Contents by line** (2026-10-28: each number is the line of this file, header included, where the
section begins). J. A. Robinson, «A Machine-Oriented Logic Based on the Resolution Principle»,
*Journal of the ACM* 12(1), January 1965, pp. 23–41, DOI 10.1145/321250.321253. The text comes from
a math-aware OCR of the scan, with the formulas in LaTeX (`$…$`, `$$…$$`), and was checked against the
page images where the OCR failed (the symbol lists of 2.2, the displays of Examples 1 and 2 and of
the example of Section 7, the proof of the Subsumption Theorem). `<!-- page N, journal p. M -->`
marks where each page of the PDF begins; the journal page is the PDF page plus 22. The scan cuts off
the right margin of journal p. 34 (the proofs of the Unification Theorem and the Lemma): the letters
restored there are in square brackets. Misprints of the original are kept («Is was noted», «Herbrand
aniverse»). Key triples and resolvents, 5.10–5.11, are on p. 33.
'''

[header.sections]
"1" = "Introduction"
"2" = "Formal preliminaries (2.19 ground resolvents)"
"3" = "Saturation procedures"
"4" = "The resolution theorems and the basic lemma"
"5" = "Substitution, unification and resolution (5.8 unification algorithm, 5.10 key triples, 5.11 resolvents)"
"6" = "The resolution principle: refutations"
"7" = "Refutation procedures, search principles"

