line-length = 119
target-version = "py314"

[lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C90",          # mccabe complexity -- honors [lint.mccabe] max-complexity below
    "S",            # flake8-bandit
    "SIM",          # flake8-simplify
    "RET",          # flake8-return
    "PIE",          # flake8-pie
    "TCH",          # flake8-type-checking
    "YTT",          # flake8-2020
    "D",            # pydocstyle
]
ignore = [
    "D203",  # one-blank-line-before-class -- conflicts with D211
    "D213",  # multi-line-summary-second-line -- conflicts with D212
]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# The tools and the exercise-bank checker are single-file scripts with a module
# docstring and nothing else: there is no point documenting every internal
# function.
"tools/**" = ["D"]
"references/**" = ["D"]
"ejemplos/**" = ["D", "S101"]

[format]
quote-style = "single"

# .gitattributes stores LF; keep ruff from writing CRLF on Windows and leaving
# half the repository "modified" by a line ending.
line-ending = "lf"
